name: Fetch Canada EV Data

on:
  schedule:
    - cron: '0 8 1 * *'   # 1st of every month at 8am UTC
  workflow_dispatch:      # allows manual trigger from Actions tab

permissions:
  contents: write          # <-- allows the workflow to commit data back

jobs:
  fetch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          npm init -y
          npm install adm-zip xlsx

      - name: Run fetch script
        run: node scripts/fetch-data.js || true

      - name: Commit new data
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff-index --quiet HEAD || git commit -m "Update EV data $(date +%Y-%m-%d)"
          git push
